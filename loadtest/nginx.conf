# Reparte la carga entre las replicas de backend-load, cada una simulando una lambda.
#
# Con `docker compose up --scale backend-load=N`, el DNS interno de Docker (127.0.0.11)
# devuelve las N direcciones del servicio. Se usa una variable en proxy_pass a proposito:
# obliga a nginx a re-resolver el nombre en cada peticion en vez de fijar las IPs al arrancar,
# que es lo que hace un `upstream` estatico y dejaria fuera a las replicas nuevas.

events {
  worker_connections 4096;
}

http {
  access_log off;

  server {
    listen 80;

    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
      set $upstream_backend "backend-load:3001";
      proxy_pass http://$upstream_backend;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # La prueba busca el punto de quiebre: los errores del backend deben llegar a k6
      # tal cual, no convertidos por nginx en un 502 generico.
      proxy_next_upstream off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
  }
}
